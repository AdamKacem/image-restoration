# Small search used for the results shown in the README (CPU-friendly).
base:
  dataset:    data/synthetic
  epochs:     2
  img_size:   96
  patience:   5

space:
  lr:
    type: log_uniform
    low:  0.0003
    high: 0.005
  batch_size:
    type: choice
    values: [16, 32]
  base_filters:
    type: choice
    values: [16, 32]
  dropout:
    type: uniform
    low:  0.1
    high: 0.3
  loss:
    type: choice
    values: [weighted_mse_ssim]
  ink_weight:
    type: choice
    values: [2.0, 4.0, 8.0]
  mse_alpha:
    type: choice
    values: [0.3, 0.5, 0.7]
